<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finales — Docente IFDC</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .carrera-titulo {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--text-3);
      padding: 20px 0 8px; border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .mesa-bloque { margin-bottom: 24px; }
    .mesa-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-logo">I</div>
      <div>
        <div class="header-title">IFDC Río Colorado</div>
        <div class="header-subtitle" id="subtituloHeader">Docente — Finales</div>
      </div>
    </div>
    <nav class="header-nav">
      <a class="btn btn-secondary" href="/docente/">← Mi panel</a>
    </nav>
  </div>
</header>

<main>

  <div class="card card-sm" id="sinSesion" style="display:none">
    <div class="alert alert-warn">
      <span>⚠</span><span>Sesión no iniciada. <a href="/docente/" style="color:var(--warn);font-weight:700">Ingresá desde el panel docente.</a></span>
    </div>
  </div>

  <div id="panelContent" style="display:none">
    <div class="page-hero" style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px">
      <div>
        <h1>Exámenes finales</h1>
        <p class="text-muted">Tus mesas de examen asignadas.</p>
      </div>
      <div class="filter-bar" style="margin:0">
        <select id="filtroTurno" onchange="filtrar()" style="width:auto">
          <option value="">Todos los turnos</option>
          <option value="feb_mar">Feb - Mar</option>
          <option value="julio">Julio</option>
            <option value="septiembre">Septiembre</option>
          <option value="nov_dic">Nov - Dic</option>
        </select>
        <select id="filtroActiva" onchange="filtrar()" style="width:auto">
          <option value="">Todas</option>
          <option value="1">Activas</option>
          <option value="0">Cerradas</option>
        </select>
        <button class="btn btn-secondary" onclick="cargar()">⟳</button>
      </div>
    </div>

    <div id="cargando" class="card text-center" style="padding:40px">
      <div class="spinner" style="border-color:rgba(26,63,168,.2);border-top-color:var(--primary);width:28px;height:28px;margin:0 auto 12px"></div>
      <p class="text-sm text-muted">Cargando mesas...</p>
    </div>

    <div id="contenido" style="display:none"></div>
  </div>

</main>

<!-- Modal: alumnos de la mesa -->
<div class="modal-overlay hidden" id="modalMesa">
  <div class="modal" style="max-width:700px">
    <h3 class="modal-title" id="modalMesaTitulo"></h3>
    <p class="text-sm text-muted" id="modalMesaSub" style="margin-bottom:16px"></p>
    <div id="modalMesaContent" style="max-height:400px;overflow-y:auto;padding-right:8px;"></div>
    <div class="modal-footer" style="margin-top:16px">
      <button class="btn btn-secondary" onclick="cerrarModal()">Cerrar</button>
    </div>
  </div>
</div>

<!-- Modal confirmación -->
<div class="modal-overlay hidden" id="modalConfirm">
  <div class="modal">
    <h3 class="modal-title" id="modalConfirmTitle">¿Confirmar?</h3>
    <p class="modal-body text-sm text-muted" id="modalConfirmMsg"></p>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modalConfirmCancel">Cancelar</button>
      <button class="btn btn-primary" id="modalConfirmOk">Confirmar</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>
let docenteData  = null;
let todasLasMesas = [];
let mesaActiva    = null;
const turnoLabel  = { feb_mar: 'Feb - Mar', julio: 'Julio', septiembre: 'Septiembre', nov_dic: 'Nov - Dic' };

if (!localStorage.getItem('docente_auth')) {
  document.getElementById('sinSesion').style.display    = 'block';
} else {
  docenteData = JSON.parse(localStorage.getItem('docente_data') || '{}');
  document.getElementById('panelContent').style.display = 'block';
  document.getElementById('subtituloHeader').textContent =
    `Prof. ${docenteData.apellido}, ${docenteData.nombre} — Finales`;
  cargar();
}

async function cargar() {
  document.getElementById('cargando').style.display  = 'block';
  document.getElementById('contenido').style.display = 'none';
  try {
    const res  = await fetch(API + '/docente/mesas?id_docente=' + docenteData.id_docente, { signal: AbortSignal.timeout(8000) });
    const data = await res.json();
    todasLasMesas = data.mesas || [];
    filtrar();
  } catch {
    document.getElementById('contenido').innerHTML =
      '<div class="alert alert-error"><span>✕</span><span>Error al cargar mesas.</span></div>';
  } finally {
    document.getElementById('cargando').style.display  = 'none';
    document.getElementById('contenido').style.display = 'block';
  }
}

function filtrar() {
  const turno  = document.getElementById('filtroTurno').value;
  const activa = document.getElementById('filtroActiva').value;
  const datos  = todasLasMesas.filter(m => {
    if (turno   && m.turno !== turno)           return false;
    if (activa === '1' && !m.activa)            return false;
    if (activa === '0' &&  m.activa)            return false;
    return true;
  });
  renderMesas(datos);
}

function renderMesas(mesas) {
  const cont = document.getElementById('contenido');
  if (!mesas.length) {
    cont.innerHTML = `
      <div class="empty-state card" style="padding:40px">
        <div class="empty-state-icon">📝</div>
        <p>No tenés mesas de examen asignadas.</p>
      </div>`;
    return;
  }

  // Agrupar por carrera
  const porCarrera = {};
  mesas.forEach(m => {
    if (!porCarrera[m.nombre_carrera]) porCarrera[m.nombre_carrera] = [];
    porCarrera[m.nombre_carrera].push(m);
  });

  cont.innerHTML = Object.entries(porCarrera).map(([carrera, mats]) => `
    <div class="card">
      <div class="carrera-titulo">${esc(carrera)}</div>
      ${mats.map(m => `
        <div class="mesa-bloque">
          <div class="mesa-header">
            <div>
              <div style="font-weight:700;font-size:15px">${esc(m.nombre_materia)}</div>
              <div class="text-sm text-muted" style="margin-top:3px">
                ${turnoLabel[m.turno] || m.turno} ${esc(String(m.anio))}
                ${m.fecha_mesa ? ' · ' + new Date(m.fecha_mesa).toLocaleDateString('es-AR') : ''}
                ${m.aula ? ' · 📍 ' + esc(m.aula) : ''}
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              ${m.activa
                ? '<span class="pill pill-aprobado">Activa</span>'
                : '<span class="pill pill-pendiente">Cerrada</span>'}
              <span class="text-sm text-muted">${m.total_inscriptos || 0} inscripto${m.total_inscriptos !== 1 ? 's' : ''}</span>
            </div>
          </div>
          <button class="btn btn-primary" style="font-size:13px;padding:7px 16px"
            onclick="verAlumnos(${m.id_mesa},'${esc(m.nombre_materia)}','${turnoLabel[m.turno]} ${m.anio}')">
            👥 Ver alumnos y cargar notas
          </button>
        </div>
      `).join('<hr style="border:none;border-top:1px solid var(--border);margin:16px 0">')}
    </div>
  `).join('');
}

async function verAlumnos(idMesa, nombreMateria, turnoAnio) {
  mesaActiva = idMesa;
  document.getElementById('modalMesaTitulo').textContent = nombreMateria;
  document.getElementById('modalMesaSub').textContent    = turnoAnio;
  document.getElementById('modalMesaContent').innerHTML  =
    '<div class="text-sm text-muted" style="padding:12px">Cargando...</div>';
  document.getElementById('modalMesa').classList.remove('hidden');
  await recargarAlumnos(idMesa);
}

async function recargarAlumnos(idMesa) {
  try {
    const res    = await fetch(API + '/docente/mesas/' + idMesa + '/inscriptos', { signal: AbortSignal.timeout(8000) });
    const data   = await res.json();
    const alumnos = data.inscriptos || [];

    if (!alumnos.length) {
      document.getElementById('modalMesaContent').innerHTML =
        '<div class="empty-state" style="padding:24px"><div class="empty-state-icon">👥</div><p>No hay alumnos inscriptos todavía.</p></div>';
      return;
    }

    const condPill = e => ({
      pendiente: '<span class="pill pill-pendiente">Pendiente</span>',
      apto:      '<span class="pill pill-aprobado">Apto</span>',
      no_apto:   '<span class="pill pill-rechazado">No apto</span>',
    }[e] || e);

    const resPill = r => ({
      aprobado:  '<span class="pill pill-aprobado">Aprobado</span>',
      reprobado: '<span class="pill pill-rechazado">Reprobado</span>',
      ausente:   '<span class="pill pill-pendiente">Ausente</span>',
    }[r] || '<span class="text-muted">—</span>');

    document.getElementById('modalMesaContent').innerHTML = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Alumno</th><th>DNI</th><th>Condición</th><th>Resultado</th><th>Nota</th><th>Cargar</th></tr>
          </thead>
          <tbody>
            ${alumnos.map(a => `
              <tr>
                <td><div class="td-name">${esc(a.apellido)}, ${esc(a.nombre)}</div></td>
                <td>${esc(a.dni)}</td>
                <td>${condPill(a.estado_condicion)}</td>
                <td>${resPill(a.resultado)}</td>
                <td>${a.nota_obtenida != null ? '<strong>' + a.nota_obtenida + '</strong>' : '—'}</td>
                <td>
                  ${a.estado_condicion === 'apto' ? `
                    <div class="actions" style="gap:6px">
                      <input type="number" id="nota-${a.id_inscripcion}" min="1" max="10" step="0.25"
                        placeholder="Nota" value="${a.nota_obtenida || ''}"
                        style="width:70px;padding:6px 8px;font-size:13px;border-radius:var(--radius-sm);border:1.5px solid var(--border)">
                      <select id="res-${a.id_inscripcion}"
                        style="padding:6px 8px;font-size:13px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font:inherit">
                        <option value="">Resultado</option>
                        <option value="aprobado"  ${a.resultado==='aprobado' ?'selected':''}>Aprobado</option>
                        <option value="reprobado" ${a.resultado==='reprobado'?'selected':''}>Reprobado</option>
                        <option value="ausente"   ${a.resultado==='ausente'  ?'selected':''}>Ausente</option>
                      </select>
                      <button class="btn btn-primary" style="padding:6px 12px;font-size:12px"
                        onclick="guardarNota(${a.id_inscripcion},'${esc(a.apellido)} ${esc(a.nombre)}')">✓</button>
                    </div>
                  ` : `<span class="text-sm text-muted">${
                    a.estado_condicion === 'no_apto' ? 'No apto' : 'Pend. verificación Sec.'
                  }</span>`}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch {
    document.getElementById('modalMesaContent').innerHTML =
      '<div class="alert alert-error"><span>✕</span><span>Error al cargar alumnos.</span></div>';
  }
}

function cerrarModal() {
  document.getElementById('modalMesa').classList.add('hidden');
  mesaActiva = null;
}

async function guardarNota(idInscripcion, nombre) {
  const nota      = parseFloat(document.getElementById('nota-' + idInscripcion)?.value);
  const resultado = document.getElementById('res-' + idInscripcion)?.value;

  if (!resultado) return alert('Seleccioná el resultado.');
  if (resultado !== 'ausente' && (isNaN(nota) || nota < 1 || nota > 10))
    return alert('Ingresá una nota válida entre 1 y 10.');

  const ok = await confirmar({
    titulo:  'Cargar nota',
    mensaje: `¿Confirmás ${resultado !== 'ausente' ? 'nota ' + nota + ' — ' : ''}${resultado} para ${nombre}?`,
    btnOk:   'Sí, guardar'
  });
  if (!ok) return;

  try {
    const res  = await fetch(API + '/docente/mesas/resultado', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id_inscripcion: idInscripcion,
        resultado,
        nota_obtenida: resultado !== 'ausente' ? nota : null
      }),
      signal: AbortSignal.timeout(8000)
    });
    const data = await res.json();
    if (data.ok) {
      await recargarAlumnos(mesaActiva);
      await cargar();
    } else {
      alert(data.error || 'Error al guardar.');
    }
  } catch {
    alert('No se pudo conectar con el servidor.');
  }
}
</script>
</body>
</html>
