<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TIC</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><h1>Acceso Área TIC</h1></header><main>
<div class="card" id="loginCard" style="max-width:520px;margin:0 auto;">
  <input id="password" type="password" placeholder="Contraseña de acceso">
  <div class="actions"><button onclick="login()">Ingresar</button><a class="button secondary" href="/inicio">Volver al menú principal</a></div>
  <div id="loginStatus" class="status"></div>
</div>
<div class="card" id="panel" style="display:none;">
  <div class="actions"><a class="button secondary" href="/inicio">Volver al menú principal</a><button class="secondary" onclick="cargar()">Actualizar listado</button></div>
  <h2>Estudiantes aprobados por Secretaría</h2>
  <div class="table-wrap"><table><thead><tr><th>Apellido y nombre</th><th>DNI</th><th>Carrera</th><th>Año</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="tbody"></tbody></table></div>
</div>
<script>
async function login(){
  const password=document.getElementById('password').value;
  const res=await fetch('http://localhost:8080/tic/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
  const data=await res.json();
  if(data.ok){ document.getElementById('loginCard').style.display='none'; document.getElementById('panel').style.display='block'; cargar(); }
  else { const s=document.getElementById('loginStatus'); s.textContent=data.error; s.className='status error'; }
}
async function cargar(){
  const res=await fetch('http://localhost:8080/tic/estudiantes');
  const data=await res.json();
  const tb=document.getElementById('tbody'); tb.innerHTML='';
  data.forEach(r=>{
    const tr=document.createElement('tr');
    const boton = r.estado_general==='cargado_plataforma' ? '<span class="pill">Cargado</span>' : `<button class="good" onclick="marcar(${r.id_estudiante})">Marcar cargado</button>`;
    tr.innerHTML=`<td>${r.apellido} ${r.nombre}<br><span class="small">${r.correo}</span></td><td>${r.dni}</td><td>${r.nombre_carrera}</td><td>${r.anio_actual}°</td><td><span class="pill">${r.estado_general}</span></td><td>${boton}</td>`;
    tb.appendChild(tr);
  });
}
async function marcar(id){
  if(!confirm('¿Seguro que querés marcarlo como cargado en plataforma?')) return;
  const observaciones=prompt('Observaciones TIC (opcional):')||'';
  const res=await fetch('http://localhost:8080/tic/cargar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id_estudiante:id,observaciones})});
  const data=await res.json();
  alert(data.message||data.error);
  if(data.ok) cargar();
}
</script></main></body></html>
