<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Constancia de inscripción</title>
<style>
  @page { margin: 2cm; }
  * { box-sizing: border-box; }
  body {
    font-family: 'Roboto', Arial, sans-serif;
    color: #1B2E10;
    max-width: 700px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 3px solid #4CAF1A;
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 20px;
    margin: 0;
    color: #1B2E10;
  }
  .header p {
    margin: 2px 0 0;
    font-size: 13px;
    color: #555;
  }
  h2 {
    font-size: 22px;
    text-align: center;
    color: #1B2E10;
    margin: 24px 0;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 20px 0;
  }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid #e0e0e0;
    font-size: 14px;
  }
  td.label {
    font-weight: bold;
    color: #1B2E10;
    width: 40%;
    background: #f5f9f2;
  }
  .aviso {
    margin-top: 24px;
    padding: 12px 16px;
    background: #fff8e6;
    border-left: 4px solid #F5A623;
    font-size: 13px;
  }
  .footer {
    margin-top: 40px;
    text-align: center;
    font-size: 12px;
    color: #999;
  }
  .btn-imprimir {
    display: block;
    margin: 24px auto;
    padding: 10px 24px;
    background: #4CAF1A;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  .estado { text-align: center; padding: 40px; font-size: 14px; color: #555; }
  @media print {
    .btn-imprimir { display: none; }
    body { margin: 0; }
  }
</style>
</head>
<body>

  <div id="contenido" class="estado">Cargando constancia...</div>

  <script>
    const API = 'http://consejoescolarvm2.ddns.net:8080';
    const TURNO_LABEL = { feb_mar: 'Febrero - Marzo', julio: 'Julio', septiembre: 'Septiembre', nov_dic: 'Noviembre - Diciembre' };

    function esc(s) {
      return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function formatearFecha(f) {
      if (!f) return 'A confirmar';
      const d = new Date(f);
      return d.toLocaleDateString('es-AR', { day: '2-digit', month: 'long', year: 'numeric' });
    }

    async function cargarConstancia() {
      const params = new URLSearchParams(window.location.search);
      const dni = params.get('dni');
      const idMesa = params.get('id_mesa');
      const cont = document.getElementById('contenido');

      if (!dni || !idMesa) {
        cont.innerHTML = 'Faltan datos para generar la constancia.';
        return;
      }

      try {
        const res = await fetch(API + '/alumno/constancia-mesa?dni=' + encodeURIComponent(dni) + '&id_mesa=' + encodeURIComponent(idMesa));
        const data = await res.json();

        if (!data.ok) {
          cont.innerHTML = esc(data.error || 'No se pudo obtener la constancia.');
          return;
        }

        const c = data.constancia;
        const docente = (c.docente_nombre || c.docente_apellido)
          ? esc(c.docente_apellido) + ', ' + esc(c.docente_nombre)
          : 'Sin asignar';
        const hora = c.hora_mesa ? c.hora_mesa.substring(0, 5) + ' hs' : 'A confirmar';
        const fechaInsc = c.fecha_inscripcion ? new Date(c.fecha_inscripcion).toLocaleString('es-AR') : '';

        cont.outerHTML = `
          <div class="header">
            <div>
              <h1>IFDC Río Colorado</h1>
              <p>Instituto de Formación Docente Continua</p>
            </div>
          </div>

          <h2>Constancia de inscripción a mesa de examen</h2>

          <table>
            <tr><td class="label">Estudiante</td><td>${esc(c.apellido)}, ${esc(c.nombre)}</td></tr>
            <tr><td class="label">DNI</td><td>${esc(c.dni)}</td></tr>
            <tr><td class="label">Carrera</td><td>${esc(c.nombre_carrera)}</td></tr>
            <tr><td class="label">Materia</td><td>${esc(c.nombre_materia)}</td></tr>
            <tr><td class="label">Turno</td><td>${TURNO_LABEL[c.turno] || esc(c.turno)} ${esc(c.anio)}</td></tr>
            <tr><td class="label">Fecha del examen</td><td>${formatearFecha(c.fecha_mesa)}</td></tr>
            <tr><td class="label">Hora</td><td>${hora}</td></tr>
            <tr><td class="label">Aula / Sala</td><td>${esc(c.aula) || 'A confirmar'}</td></tr>
            <tr><td class="label">Docente titular</td><td>${docente}</td></tr>
          </table>

          <div class="aviso">
            Esta constancia certifica tu inscripción registrada el ${esc(fechaInsc)}. Tu condición para rendir será verificada por Secretaría antes de la fecha del examen.
          </div>

          <button class="btn-imprimir" onclick="window.print()">Imprimir / Guardar como PDF</button>

          <div class="footer">Generado automáticamente por el sistema de gestión de IFDC Río Colorado</div>
        `;
      } catch (e) {
        cont.innerHTML = 'Error de conexión al generar la constancia.';
      }
    }

    cargarConstancia();
  </script>

</body>
</html>
