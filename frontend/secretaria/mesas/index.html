<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesas de examen — Secretaría IFDC</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .mesa-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      transition: box-shadow .15s;
    }
    .mesa-card:hover { box-shadow: var(--shadow); }
    .mesa-card.activa   { border-left: 4px solid var(--ok); }
    .mesa-card.inactiva { border-left: 4px solid var(--border-strong); opacity: .7; }

    .mesa-header {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 12px; margin-bottom: 10px;
    }
    .mesa-titulo { font-weight: 700; font-size: 16px; }
    .mesa-meta   { font-size: 13px; color: var(--text-3); margin-top: 3px; }
    .mesa-grid   { display: grid; gap: 12px; }

    .alumnos-lista { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-logo">I</div>
      <div>
        <div class="header-title">IFDC Río Colorado</div>
        <div class="header-subtitle">Secretaría — Mesas de examen</div>
      </div>
    </div>
    <nav class="header-nav">
      <a class="btn btn-secondary" href="/secretaria/">← Panel Secretaría</a>
    </nav>
  </div>
</header>

<main>

  <div class="card card-sm" id="sinSesion" style="display:none">
    <div class="alert alert-warn">
      <span>⚠</span><span>Sesión no iniciada. <a href="/secretaria/" style="color:var(--warn);font-weight:700">Ingresá desde el panel de Secretaría.</a></span>
    </div>
  </div>

  <div id="panelContent" style="display:none">
    <div class="page-hero" style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px">
      <div>
        <h1>Mesas de examen</h1>
        <p>Creá y gestioná las mesas de examen final.</p>
      </div>
      <button class="btn btn-primary" onclick="abrirModalMesa()">+ Nueva mesa</button>
    </div>

    <!-- Filtros -->
    <div class="card" style="padding:16px 20px">
      <div class="filter-bar">
        <select id="filtroTurno" onchange="filtrar()" style="max-width:180px">
          <option value="">Todos los turnos</option>
          <option value="feb_mar">Feb - Mar</option>
          <option value="julio">Julio</option>
            <option value="septiembre">Septiembre</option>
          <option value="nov_dic">Nov - Dic</option>
        </select>
        <select id="filtroCarrera" onchange="filtrar()" style="max-width:220px">
          <option value="">Todas las carreras</option>
        </select>
        <select id="filtroActiva" onchange="filtrar()" style="max-width:160px">
          <option value="">Todas</option>
          <option value="1">Activas</option>
          <option value="0">Cerradas</option>
        </select>
        <button class="btn btn-secondary" onclick="cargar()">⟳ Actualizar</button>
      </div>
    </div>

    <!-- Lista de mesas -->
    <div id="mesasGrid" class="mesa-grid"></div>
    <div id="emptyState" class="empty-state card" style="display:none">
      <div class="empty-state-icon">📝</div>
      <p>No hay mesas con ese criterio.</p>
    </div>

  </div>
</main>

<!-- Modal: crear/editar mesa -->
<div class="modal-overlay hidden" id="modalMesa">
  <div class="modal" style="max-width:540px">
    <h3 class="modal-title" id="modalMesaTitulo">Nueva mesa de examen</h3>
    <div class="modal-body" style="max-height:70vh;overflow-y:auto">
      <div class="grid" style="gap:14px">

        <div class="field">
          <label class="field-label">Carrera</label>
          <select id="mesaCarrera" onchange="cargarMateriasPorCarrera()">
            <option value="">Seleccioná una carrera</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label">Materia *</label>
          <select id="mesaMateria">
            <option value="">Primero seleccioná la carrera</option>
          </select>
        </div>

        <div class="grid grid-2" style="gap:14px">
          <div class="field">
            <label class="field-label">Turno *</label>
            <select id="mesaTurno">
              <option value="">Seleccioná el turno</option>
              <option value="feb_mar">Feb - Mar</option>
              <option value="julio">Julio</option>
            <option value="septiembre">Septiembre</option>
              <option value="nov_dic">Nov - Dic</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label">Año *</label>
            <input id="mesaAnio" type="number" placeholder="Ej: 2025" min="2020" max="2099">
          </div>
        </div>

        <div class="grid grid-2" style="gap:14px">
          <div class="field">
            <label class="field-label">Fecha del examen</label>
            <input id="mesaFecha" type="date">
          </div>
          <div class="field">
            <label class="field-label">Hora del examen</label>
            <input id="mesaHora" type="time">
          </div>
        </div>
        <div class="field">
          <label class="field-label">Tribunal (además del docente titular)</label>
          <input id="mesaTribunal" type="text" placeholder="Ej: Contreras Azanza — Tomaselli Pizá">
        </div>

        <div class="grid grid-2" style="gap:14px">
          <div class="field">
            <label class="field-label">Aula / Sala</label>
            <input id="mesaAula" type="text" placeholder="Ej: Aula 3, Virtual...">
          </div>
          <div class="field">
            <label class="field-label">Docente titular</label>
            <select id="mesaDocente">
              <option value="">Sin asignar</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label class="field-label">Estado</label>
          <select id="mesaActiva">
            <option value="1">Activa — abierta para inscripción</option>
            <option value="0">Cerrada</option>
          </select>
        </div>

      </div>
    </div>
    <div id="modalMesaStatus" class="alert" style="display:none;margin:0 0 12px"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="cerrarModalMesa()">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarMesa" onclick="guardarMesa()">Crear mesa</button>
    </div>
  </div>
</div>

<!-- Modal: alumnos inscriptos + cargar resultados -->
<div class="modal-overlay hidden" id="modalAlumnos">
  <div class="modal" style="max-width:700px">
    <h3 class="modal-title" id="modalAlumnosTitulo">Alumnos inscriptos</h3>
    <p class="text-sm text-muted" id="modalAlumnosSub" style="margin-bottom:16px"></p>
    <div id="modalAlumnosContent"></div>
    <div class="modal-footer" style="margin-top:16px">
      <button class="btn btn-secondary" onclick="cerrarModalAlumnos()">Cerrar</button>
    </div>
  </div>
</div>

<!-- Modal confirmación -->
<div class="modal-overlay hidden" id="modalConfirm">
  <div class="modal">
    <h3 class="modal-title" id="modalConfirmTitle">¿Confirmar?</h3>
    <p class="modal-body text-sm text-muted" id="modalConfirmMsg"></p>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modalConfirmCancel">Cancelar</button>
      <button class="btn btn-primary" id="modalConfirmOk">Confirmar</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>
let todasLasMesas = [];
let todasLasCarreras = [];
let mesaEditandoId = null;

if (!sessionStorage.getItem('sec_auth')) {
  document.getElementById('sinSesion').style.display    = 'block';
} else {
  document.getElementById('panelContent').style.display = 'block';
  inicializar();
}

async function inicializar() {
  await Promise.all([cargarCarrerasSelect(), cargarDocentesSelect()]);
  await cargar();
}

// ── Cargar mesas ─────────────────────────────────────────────────
async function cargar() {
  try {
    const res = await fetch(API + '/secretaria/mesas', { signal: AbortSignal.timeout(8000) });
    todasLasMesas = await res.json();
    poblarFiltroCarreras();
    filtrar();
  } catch {
    document.getElementById('mesasGrid').innerHTML =
      `<div class="alert alert-error"><span>✕</span><span>Error al cargar mesas.</span></div>`;
  }
}

function poblarFiltroCarreras() {
  const sel = document.getElementById('filtroCarrera');
  const carreras = [...new Set(todasLasMesas.map(m => m.nombre_carrera))].sort();
  sel.innerHTML = '<option value="">Todas las carreras</option>';
  carreras.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c; sel.appendChild(o);
  });
}

function filtrar() {
  const turno   = document.getElementById('filtroTurno').value;
  const carrera = document.getElementById('filtroCarrera').value;
  const activa  = document.getElementById('filtroActiva').value;

  const datos = todasLasMesas.filter(m => {
    if (turno   && m.turno !== turno)          return false;
    if (carrera && m.nombre_carrera !== carrera) return false;
    if (activa === '1' && !m.activa)           return false;
    if (activa === '0' &&  m.activa)           return false;
    return true;
  });
  renderMesas(datos);
}

function renderMesas(datos) {
  const grid  = document.getElementById('mesasGrid');
  const empty = document.getElementById('emptyState');

  if (!datos.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  const turnoLabel = { feb_mar: 'Feb - Mar', julio: 'Julio', septiembre: 'Septiembre', nov_dic: 'Nov - Dic' };

  grid.innerHTML = datos.map(m => `
    <div class="mesa-card ${m.activa ? 'activa' : 'inactiva'}">
      <div class="mesa-header">
        <div>
          <div class="mesa-titulo">${esc(m.nombre_materia)}</div>
          <div class="mesa-meta">
            ${esc(m.nombre_carrera)} ·
            ${turnoLabel[m.turno] || m.turno} ${esc(String(m.anio))}
            ${m.fecha_mesa ? ' · ' + new Date(m.fecha_mesa).toLocaleDateString('es-AR') : ''}
          </div>
          <div class="mesa-meta" style="margin-top:4px">
            ${m.aula ? '📍 ' + esc(m.aula) : ''}
            ${m.docente_nombre ? ' · 👤 ' + esc(m.docente_nombre) : ''}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          ${m.activa
            ? '<span class="pill pill-aprobado">Activa</span>'
            : '<span class="pill pill-pendiente">Cerrada</span>'}
          <span class="text-sm text-muted">${m.total_inscriptos || 0} inscripto${m.total_inscriptos !== 1 ? 's' : ''}</span>
        </div>
      </div>
      <div class="actions" style="gap:8px">
        <button class="btn btn-secondary" style="font-size:13px;padding:6px 12px"
          onclick="verAlumnos(${m.id_mesa}, '${esc(m.nombre_materia)}', '${turnoLabel[m.turno]} ${m.anio}')">
          👥 Ver inscriptos
        </button>
        <button class="btn btn-secondary" style="font-size:13px;padding:6px 12px"
          onclick="editarMesa(${m.id_mesa})">
          ✏ Editar
        </button>
        <button class="btn ${m.activa ? 'btn-warn' : 'btn-ok'}" style="font-size:13px;padding:6px 12px"
          onclick="toggleMesa(${m.id_mesa}, ${m.activa})">
          ${m.activa ? 'Cerrar inscripción' : 'Reabrir inscripción'}
        </button>
          <button class="btn btn-danger" style="font-size:13px;padding:6px 12px" title="Eliminar mesa"
            onclick="eliminarMesa(${m.id_mesa}, '${esc(m.nombre_materia)}')">
            🗑
          </button>
      </div>
    </div>
  `).join('');
}

// ── Modal nueva/editar mesa ───────────────────────────────────────
async function cargarCarrerasSelect() {
  try {
    const res  = await fetch(API + '/carreras', { signal: AbortSignal.timeout(6000) });
    todasLasCarreras = await res.json();
    const sel = document.getElementById('mesaCarrera');
    sel.innerHTML = '<option value="">Seleccioná una carrera</option>';
    todasLasCarreras.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id_carrera; o.textContent = c.nombre_carrera;
      sel.appendChild(o);
    });
  } catch { /* silencioso */ }
}

async function cargarDocentesSelect() {
  try {
    const res  = await fetch(API + '/secretaria/docentes', { signal: AbortSignal.timeout(6000) });
    const data = await res.json();
    const sel  = document.getElementById('mesaDocente');
    sel.innerHTML = '<option value="">Sin asignar</option>';
    data.forEach(d => {
      const o = document.createElement('option');
      o.value = d.id_docente;
      o.textContent = `${d.apellido}, ${d.nombre}`;
      sel.appendChild(o);
    });
  } catch { /* silencioso */ }
}

async function cargarMateriasPorCarrera() {
  const idCarrera = document.getElementById('mesaCarrera').value;
  const sel = document.getElementById('mesaMateria');
  if (!idCarrera) {
    sel.innerHTML = '<option value="">Primero seleccioná la carrera</option>';
    return;
  }
  sel.innerHTML = '<option value="">Cargando...</option>';
  try {
    const res  = await fetch(API + '/materias?id_carrera=' + idCarrera, { signal: AbortSignal.timeout(6000) });
    const data = await res.json();
    sel.innerHTML = '<option value="">Seleccioná una materia</option>';
    // Agrupar por año
    const porAnio = {};
    data.forEach(m => {
      if (!porAnio[m.anio_plan]) porAnio[m.anio_plan] = [];
      porAnio[m.anio_plan].push(m);
    });
    Object.entries(porAnio).forEach(([anio, materias]) => {
      const group = document.createElement('optgroup');
      group.label = anio + '° año';
      materias.forEach(m => {
        const o = document.createElement('option');
        o.value = String(m.id_materia);
        const cuatrim = m.formato === 'anual' ? 'Anual' : m.cuatrimestre + '° cuatrim.';
        o.textContent = m.nombre_materia + ' (' + cuatrim + ')';
        group.appendChild(o);
      });
      sel.appendChild(group);
    });
  } catch {
    sel.innerHTML = '<option value="">Error al cargar</option>';
  }
}

function abrirModalMesa() {
  mesaEditandoId = null;
  document.getElementById('modalMesaTitulo').textContent = 'Nueva mesa de examen';
  document.getElementById('btnGuardarMesa').textContent  = 'Crear mesa';
  document.getElementById('mesaCarrera').value  = '';
  document.getElementById('mesaMateria').innerHTML = '<option value="">Primero seleccioná la carrera</option>';
  document.getElementById('mesaTurno').value    = '';
  document.getElementById('mesaAnio').value     = new Date().getFullYear();
  document.getElementById('mesaFecha').value    = '';
  document.getElementById('mesaAula').value     = '';
  document.getElementById('mesaDocente').value  = '';
  document.getElementById('mesaActiva').value   = '1';
  clearStatus(document.getElementById('modalMesaStatus'));
  document.getElementById('modalMesa').classList.remove('hidden');
}

async function editarMesa(id) {
  const mesa = todasLasMesas.find(m => m.id_mesa === parseInt(id));
  if (!mesa) return;
  mesaEditandoId = id;
  document.getElementById('modalMesaTitulo').textContent = 'Editar mesa';
  document.getElementById('btnGuardarMesa').textContent  = 'Guardar cambios';

  // Cargar carrera y materias
  document.getElementById('mesaCarrera').value = mesa.id_carrera || '';
  await cargarMateriasPorCarrera();
  document.getElementById('mesaMateria').value  = mesa.id_materia;
  document.getElementById('mesaTurno').value    = mesa.turno;
  document.getElementById('mesaAnio').value     = mesa.anio;
  document.getElementById('mesaFecha').value    = mesa.fecha_mesa ? mesa.fecha_mesa.split('T')[0] : '';
      document.getElementById('mesaHora').value     = mesa.hora_mesa ? mesa.hora_mesa.substring(0,5) : '';
      document.getElementById('mesaTribunal').value = mesa.tribunal || '';
  document.getElementById('mesaAula').value     = mesa.aula || '';
  document.getElementById('mesaDocente').value  = mesa.id_docente || '';
  document.getElementById('mesaActiva').value   = mesa.activa ? '1' : '0';
  clearStatus(document.getElementById('modalMesaStatus'));
  document.getElementById('modalMesa').classList.remove('hidden');
}

function cerrarModalMesa() {
  document.getElementById('modalMesa').classList.add('hidden');
  mesaEditandoId = null;
}

async function eliminarMesa(idMesa, nombreMateria) {
  if (!confirm('¿Eliminar la mesa de "' + nombreMateria + '"? Esta acción no se puede deshacer.')) return;
  try {
    const res = await fetch(API + '/secretaria/mesas/' + idMesa, { method: 'DELETE' });
    const data = await res.json();
    if (data.ok) {
      await cargar();
    } else {
      alert(data.error || 'No se pudo eliminar la mesa.');
    }
  } catch (e) {
    alert('Error de conexión al eliminar la mesa.');
  }
}

async function guardarMesa() {
  const status     = document.getElementById('modalMesaStatus');
  const idMateria  = parseInt(document.getElementById('mesaMateria').value) || 0;
  const turno      = document.getElementById('mesaTurno').value;
  const anio       = parseInt(document.getElementById('mesaAnio').value);
  const fecha      = document.getElementById('mesaFecha').value;
  const hora        = document.getElementById('mesaHora').value;
  const tribunal    = document.getElementById('mesaTribunal').value.trim();
  const aula       = document.getElementById('mesaAula').value.trim();
  const idDocente  = parseInt(document.getElementById('mesaDocente').value) || null;
  const activa     = document.getElementById('mesaActiva').value === '1';

  clearStatus(status);
  if (!idMateria || idMateria === 0) return setStatus(status, 'Seleccioná una materia.', 'warn');
  if (!turno)     return setStatus(status, 'Seleccioná el turno.', 'warn');
  if (!anio)      return setStatus(status, 'Ingresá el año.', 'warn');

  const btn = document.getElementById('btnGuardarMesa');
  setLoading(btn, true, 'Guardando...');

  try {
    const url    = mesaEditandoId
      ? API + '/secretaria/mesas/' + mesaEditandoId
      : API + '/secretaria/mesas';
    const method = mesaEditandoId ? 'PUT' : 'POST';

    const res  = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id_materia: idMateria, turno, anio, fecha_mesa: fecha || null, hora_mesa: hora || null, aula: aula || null, id_docente: idDocente, activa, tribunal: tribunal || null }),
      signal: AbortSignal.timeout(8000)
    });
    const data = await res.json();
    if (data.ok) {
      cerrarModalMesa();
      await cargar();
    } else {
      setStatus(status, data.error || 'Error al guardar.', 'error');
    }
  } catch {
    setStatus(status, 'No se pudo conectar con el servidor.', 'error');
  } finally {
    setLoading(btn, false);
  }
}

async function toggleMesa(id, estaActiva) {
  id = parseInt(id);
  const ok = await confirmar({
    titulo:  estaActiva ? 'Cerrar inscripción' : 'Reabrir inscripción',
    mensaje: estaActiva
      ? 'Los alumnos ya no podrán inscribirse a esta mesa.'
      : '¿Confirmás que querés reabrir la inscripción a esta mesa?',
    btnOk:  estaActiva ? 'Sí, cerrar' : 'Sí, reabrir',
    tipo:   estaActiva ? 'warn' : 'ok'
  });
  if (!ok) return;

  try {
    const res  = await fetch(API + '/secretaria/mesas/' + id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ activa: !estaActiva }),
      signal: AbortSignal.timeout(6000)
    });
    const data = await res.json();
    if (data.ok) await cargar();
    else alert(data.error || 'Error.');
  } catch {
    alert('No se pudo conectar con el servidor.');
  }
}

// ── Modal alumnos inscriptos ──────────────────────────────────────
async function verAlumnos(idMesa, nombreMateria, turnoAnio) {
  document.getElementById('modalAlumnosTitulo').textContent = nombreMateria;
  document.getElementById('modalAlumnosSub').textContent    = turnoAnio;
  document.getElementById('modalAlumnosContent').innerHTML  =
    '<div class="text-sm text-muted" style="padding:12px">Cargando...</div>';
  document.getElementById('modalAlumnos').classList.remove('hidden');

  try {
    const res  = await fetch(API + '/secretaria/mesas/' + idMesa + '/inscriptos', { signal: AbortSignal.timeout(8000) });
    const data = await res.json();
    const alumnos = data.inscriptos || [];

    if (!alumnos.length) {
      document.getElementById('modalAlumnosContent').innerHTML =
        '<div class="empty-state" style="padding:24px"><div class="empty-state-icon">👥</div><p>No hay alumnos inscriptos todavía.</p></div>';
      return;
    }

    document.getElementById('modalAlumnosContent').innerHTML = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Alumno</th>
              <th>DNI</th>
              <th>Condición</th>
              <th>Resultado</th>
              <th>Nota</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody>
            ${alumnos.map(a => `
              <tr id="fila-${a.id_inscripcion}">
                <td>
                  <div class="td-name">${esc(a.apellido)}, ${esc(a.nombre)}</div>
                  <div class="td-sub">${esc(a.dni)}</div>
                </td>
                <td>${esc(a.dni)}</td>
                <td>${condicionPill(a.estado_condicion)}</td>
                <td>${a.resultado ? resultadoPill(a.resultado) : '<span class="text-muted">—</span>'}</td>
                <td>${a.nota_obtenida != null ? '<strong>' + a.nota_obtenida + '</strong>' : '—'}</td>
                <td>
                  <div class="actions" style="gap:6px;flex-direction:column;align-items:stretch">
                    ${a.estado_condicion === 'pendiente' ? `
                      <button class="btn btn-ok"  style="padding:4px 10px;font-size:12px"
                        onclick="verificarCondicion(${a.id_inscripcion},'apto')">✓ Apto</button>
                      <button class="btn btn-bad" style="padding:4px 10px;font-size:12px"
                        onclick="verificarCondicion(${a.id_inscripcion},'no_apto')">✕ No apto</button>
                    ` : ''}
                    ${a.estado_condicion === 'apto' && !a.resultado ? `
                      <button class="btn btn-primary" style="padding:4px 10px;font-size:12px"
                        onclick="abrirResultado(${a.id_inscripcion},'${esc(a.apellido)} ${esc(a.nombre)}')">
                        📝 Cargar resultado
                      </button>
                    ` : ''}
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch {
    document.getElementById('modalAlumnosContent').innerHTML =
      '<div class="alert alert-error"><span>✕</span><span>Error al cargar alumnos.</span></div>';
  }
}

function cerrarModalAlumnos() {
  document.getElementById('modalAlumnos').classList.add('hidden');
}

function condicionPill(estado) {
  const map = {
    pendiente: '<span class="pill pill-pendiente">Pendiente</span>',
    apto:      '<span class="pill pill-aprobado">Apto</span>',
    no_apto:   '<span class="pill pill-rechazado">No apto</span>',
  };
  return map[estado] || estado;
}

function resultadoPill(resultado) {
  const map = {
    aprobado:  '<span class="pill pill-aprobado">Aprobado</span>',
    reprobado: '<span class="pill pill-rechazado">Reprobado</span>',
    ausente:   '<span class="pill pill-pendiente">Ausente</span>',
  };
  return map[resultado] || resultado;
}

async function verificarCondicion(idInscripcion, estado) {
  try {
    const res  = await fetch(API + '/secretaria/mesas/verificar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id_inscripcion: idInscripcion, estado_condicion: estado }),
      signal: AbortSignal.timeout(6000)
    });
    const data = await res.json();
    if (data.ok) {
      // Recargar modal actual
      const titulo = document.getElementById('modalAlumnosTitulo').textContent;
      const sub    = document.getElementById('modalAlumnosSub').textContent;
      // Buscar id_mesa del título — más simple: recargar la mesa activa
      await cargar();
      // Refrescar lista de alumnos del modal que está abierto
      const mesaAbierta = todasLasMesas.find(m =>
        m.nombre_materia === titulo
      );
      if (mesaAbierta) await verAlumnos(mesaAbierta.id_mesa, titulo, sub);
    } else {
      alert(data.error || 'Error.');
    }
  } catch {
    alert('No se pudo conectar.');
  }
}

// ── Modal cargar resultado ────────────────────────────────────────
let inscripcionActiva = null;

function abrirResultado(idInscripcion, nombreAlumno) {
  inscripcionActiva = idInscripcion;
  const html = `
    <div style="margin-bottom:16px">
      <strong>${esc(nombreAlumno)}</strong>
    </div>
    <div class="grid" style="gap:14px">
      <div class="field">
        <label class="field-label">Resultado *</label>
        <select id="resultadoSelect">
          <option value="">Seleccioná el resultado</option>
          <option value="aprobado">Aprobado</option>
          <option value="reprobado">Reprobado</option>
          <option value="ausente">Ausente</option>
        </select>
      </div>
      <div class="field" id="campoNota">
        <label class="field-label">Nota (1-10)</label>
        <input id="notaInput" type="number" min="1" max="10" step="0.25" placeholder="Ej: 7.5">
      </div>
      <div class="field">
        <label class="field-label">Observaciones</label>
        <input id="obsResultado" type="text" placeholder="Opcional...">
      </div>
    </div>
    <div id="statusResultado" class="alert" style="display:none;margin-top:12px"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
      <button class="btn btn-secondary" onclick="cerrarResultado()">Cancelar</button>
      <button class="btn btn-primary" id="btnConfirmarResultado" onclick="guardarResultado()">Guardar resultado</button>
    </div>
  `;
  document.getElementById('modalConfirmTitle').textContent = 'Cargar resultado';
  document.getElementById('modalConfirmMsg').innerHTML     = html;
  document.getElementById('modalConfirmOk').style.display     = 'none';
  document.getElementById('modalConfirmCancel').style.display = 'none';
  document.getElementById('modalConfirm').classList.remove('hidden');

  // Mostrar/ocultar campo nota según resultado
  document.getElementById('resultadoSelect').addEventListener('change', function() {
    document.getElementById('campoNota').style.display =
      this.value === 'ausente' ? 'none' : 'block';
  });
}

function cerrarResultado() {
  document.getElementById('modalConfirm').classList.add('hidden');
  document.getElementById('modalConfirmOk').style.display     = '';
  document.getElementById('modalConfirmCancel').style.display = '';
  inscripcionActiva = null;
}

async function guardarResultado() {
  const resultado = document.getElementById('resultadoSelect').value;
  const nota      = parseFloat(document.getElementById('notaInput').value) || null;
  const obs       = document.getElementById('obsResultado').value.trim();
  const status    = document.getElementById('statusResultado');

  if (!resultado) return setStatus(status, 'Seleccioná el resultado.', 'warn');
  if (resultado !== 'ausente' && nota === null) return setStatus(status, 'Ingresá la nota.', 'warn');
  if (nota !== null && (nota < 1 || nota > 10))  return setStatus(status, 'La nota debe estar entre 1 y 10.', 'warn');

  const btn = document.getElementById('btnConfirmarResultado');
  setLoading(btn, true, 'Guardando...');

  try {
    const res  = await fetch(API + '/secretaria/mesas/resultado', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id_inscripcion: inscripcionActiva, resultado, nota_obtenida: nota, obs_mesa: obs || null }),
      signal: AbortSignal.timeout(8000)
    });
    const data = await res.json();
    if (data.ok) {
      cerrarResultado();
      await cargar();
      const titulo = document.getElementById('modalAlumnosTitulo').textContent;
      const sub    = document.getElementById('modalAlumnosSub').textContent;
      const mesa   = todasLasMesas.find(m => m.nombre_materia === titulo);
      if (mesa) await verAlumnos(mesa.id_mesa, titulo, sub);
    } else {
      setStatus(status, data.error || 'Error al guardar.', 'error');
    }
  } catch {
    setStatus(status, 'No se pudo conectar.', 'error');
  } finally {
    setLoading(btn, false);
  }
}
</script>
