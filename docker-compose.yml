services:
  db:
    image: postgres:16
    container_name: ifdc_db
    environment:
      POSTGRES_DB: ifdc
      POSTGRES_USER: ifdc_user
      POSTGRES_PASSWORD: ifdc_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ifdc_net

  backend:
    build: ./backend
    container_name: ifdc_backend
    environment:
      DB_HOST: db
      DB_NAME: ifdc
      DB_USER: ifdc_user
      DB_PASS: ifdc_pass
      SECRETARIA_PASSWORD: Secre12456
      TIC_PASSWORD: Tic12456
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - ifdc_net

  frontend:
    image: nginx:alpine
    container_name: ifdc_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - ifdc_net

volumes:
  pgdata:

networks:
  ifdc_net:
    driver: bridge